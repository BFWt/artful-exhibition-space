name: Deploy to VPS

on:
  push:
    branches:
      - deployme
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t artful-exhibition-space:latest .

      - name: Save Docker image
        run: docker save artful-exhibition-space:latest > artful-exhibition-space.tar

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "artful-exhibition-space.tar"
          target: "/tmp/"

      - name: Deploy container on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Load the new Docker image
            docker load < /tmp/artful-exhibition-space.tar

            # Stop and remove existing container if it exists
            docker stop artful-exhibition-space || true
            docker rm artful-exhibition-space || true

            # Remove old images to save space (keep only latest)
            docker image prune -f

            # Run the new container
            docker run -d \
              --name artful-exhibition-space \
              --restart unless-stopped \
              -p 29999:80 \
              artful-exhibition-space:latest

            # Clean up the tar file
            rm -f /tmp/artful-exhibition-space.tar

            # Verify deployment
            sleep 5
            if docker ps | grep -q artful-exhibition-space; then
              echo "✅ Deployment successful! Container is running."
            else
              echo "❌ Deployment failed! Container is not running."
              exit 1
            fi
